<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>kol · CRM</title>
<link rel="manifest" href="data:application/json,{%22name%22:%22kol%20CRM%22,%22short_name%22:%22kol%20CRM%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%23080C1E%22,%22theme_color%22:%22%232952FF%22}"/>
<meta name="theme-color" content="#2952FF"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="kol CRM"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#080C1E;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;overflow:hidden}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#0F1530}
::-webkit-scrollbar-thumb{background:#2952FF44;border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes modalIn{from{opacity:0;transform:scale(0.96) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes wavePulse{from{transform:scaleY(0.5)}to{transform:scaleY(1.5)}}
.card-item{animation:fadeUp 0.25s ease;transition:border-color 0.15s,transform 0.15s}
.card-item:hover{transform:translateY(-1px)}
.inp{background:#080C1E;border:1px solid #2952FF33;border-radius:10px;padding:9px 13px;color:#fff;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;width:100%}
.inp:focus{border-color:#2952FF88}
select.inp option{background:#141936}
.btn-blue{background:linear-gradient(135deg,#2952FF,#4B6FFF);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s}
.btn-blue:hover{box-shadow:0 4px 16px #2952FF55;transform:translateY(-1px)}
.btn-blue:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-red{background:linear-gradient(135deg,#E8451A,#FF6B3D);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s;display:flex;align-items:center;gap:8px}
.btn-red:hover{box-shadow:0 4px 16px #E8451A55;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:#8892B0;border:1px solid #8892B033;border-radius:10px;padding:9px 16px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all 0.2s}
.btn-ghost:hover{border-color:#2952FF66;color:#fff}
.lbl{font-size:10px;color:#8892B0;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useCallback} = React;

const STAGES=[
  {id:"prospeccao",    label:"Prospecção",          color:"#8892B0"},
  {id:"contato",       label:"Contato Feito",        color:"#38BDF8"},
  {id:"reuniao",       label:"Reunião Agendada",     color:"#818CF8"},
  {id:"piloto",        label:"Piloto Aprovado",      color:"#A78BFA"},
  {id:"contrato",      label:"Ajustes Contratuais",  color:"#F59E0B"},
  {id:"instalacao",    label:"Instalação Feita",     color:"#FB923C"},
  {id:"resultado",     label:"Resultado Apresentado",color:"#38BDF8"},
  {id:"proposta",      label:"Proposta Enviada",     color:"#F97316"},
  {id:"fechado",       label:"Negócio Fechado ✓",    color:"#22C55E"},
];

const SEED=[
  {id:1,nome:"Casas Bahia",  contato:"—",stage:"instalacao",      notas:"Instalação confirmada. Piloto ativo.",     proximoPasso:"Acompanhar métricas do piloto",updatedAt:"2026-05-10"},
  {id:2,nome:"Magalu",       contato:"—",stage:"contato",   notas:"Interesse verbal confirmado.",             proximoPasso:"Agendar demo",                 updatedAt:"2026-05-10"},
  {id:3,nome:"Centauro",     contato:"—",stage:"prospeccao", notas:"Mencionado como potencial cliente.",       proximoPasso:"Primeiro contato",             updatedAt:"2026-05-10"},
  {id:4,nome:"Renner",       contato:"—",stage:"contato",   notas:"Conversa inicial realizada.",              proximoPasso:"Enviar material",              updatedAt:"2026-05-10"},
  {id:5,nome:"Raia Drogasil",contato:"—",stage:"prospeccao", notas:"Pipeline Latam identificado.",            proximoPasso:"Mapear contato certo",         updatedAt:"2026-05-10"},
  {id:6,nome:"Havan",        contato:"—",stage:"prospeccao", notas:"Cliente potencial varejo.",               proximoPasso:"Primeiro contato",             updatedAt:"2026-05-10"},
];

const stageInfo=id=>STAGES.find(s=>s.id===id)||STAGES[0];

function StageBadge({stageId,small}){
  const s=stageInfo(stageId);
  return <span style={{background:s.color+"22",color:s.color,border:`1px solid ${s.color}44`,borderRadius:20,padding:small?"2px 8px":"4px 12px",fontSize:small?10:11,fontWeight:600,whiteSpace:"nowrap"}}>{s.label}</span>;
}

function Avatar({nome}){
  const colors=["#2952FF","#E8451A","#00D4FF","#F59E0B","#22C55E","#818CF8"];
  const c=colors[nome.charCodeAt(0)%colors.length];
  return <div style={{width:36,height:36,borderRadius:10,background:c+"22",border:`1px solid ${c}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:800,color:c,flexShrink:0}}>{nome[0]}</div>;
}

function WaveBars({active}){
  const heights=[5,10,7,14,9,18,11,16,8,13,6,10,15,7,12];
  return <div style={{display:"flex",alignItems:"center",gap:2,height:22}}>
    {heights.map((h,i)=><div key={i} style={{width:2.5,height:active?h:4,borderRadius:2,background:active?"#E8451A":"#2952FF",opacity:active?0.85:0.35,transition:"height 0.15s ease",animationName:active?"wavePulse":"none",animationDuration:`${0.4+(i%4)*0.1}s`,animationIterationCount:"infinite",animationDirection:"alternate",animationTimingFunction:"ease-in-out",animationDelay:`${i*0.05}s`}}/>)}
  </div>;
}

const EMPTY={nome:"",contato:"",stage:"prospeccao",notas:"",proximoPasso:""};

function MicField({fieldKey,value,onChange,multiline,recording,activeField,onStart,onStop}){
  const isActive=activeField===fieldKey&&recording;
  return <div style={{display:"flex",gap:6,alignItems:"flex-start"}}>
    {multiline
      ?<textarea className="inp" value={value} onChange={e=>onChange(e.target.value)} placeholder="O que foi discutido..." style={{resize:"vertical",minHeight:64,flex:1}}/>
      :<input className="inp" value={value} onChange={e=>onChange(e.target.value)} style={{flex:1}}/>
    }
    <button onMouseDown={()=>isActive?onStop():onStart(onChange,fieldKey)} style={{width:34,height:34,borderRadius:8,border:"none",cursor:"pointer",flexShrink:0,marginTop:1,background:isActive?"#E8451A22":"#2952FF22",color:isActive?"#E8451A":"#2952FF",fontSize:15,display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s"}}>
      {isActive?"⏹":"🎙"}
    </button>
  </div>;
}

function FormSheet({data,setData,onSubmit,onCancel,title,recording,onStart,onStop,transcript,err}){
  return <div style={{position:"fixed",inset:0,background:"#00000099",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200,backdropFilter:"blur(6px)"}}>
    <div style={{background:"#141936",border:"1px solid #2952FF33",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto",animation:"modalIn 0.25s ease"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{fontSize:16,fontWeight:800}}>{title}</div>
        <button onClick={onCancel} style={{background:"none",border:"none",color:"#8892B0",cursor:"pointer",fontSize:22}}>x</button>
      </div>
      <div style={{marginBottom:16}}>
        <button onMouseDown={recording?onStop:onStart} style={{width:"100%",padding:"14px",borderRadius:12,border:`2px solid ${recording?"#E8451A":"#2952FF"}`,background:recording?"#E8451A11":"#2952FF11",color:recording?"#E8451A":"#2952FF",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:10,transition:"all 0.2s"}}>
          {recording?"Parar gravacao":"Gravar nota de voz"}
        </button>
        {transcript&&<div style={{marginTop:8,background:"#080C1E",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#CDD6F4",lineHeight:1.6,border:"1px solid #2952FF22",maxHeight:80,overflowY:"auto"}}>{transcript}</div>}
        {transcript&&<div style={{marginTop:6,fontSize:11,color:"#8892B0"}}>Transcricao acima - preencha os campos abaixo</div>}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div><div className="lbl">Empresa *</div><input className="inp" value={data.nome} onChange={e=>setData(p=>({...p,nome:e.target.value}))} placeholder="Nome da empresa"/></div>
        <div><div className="lbl">Contato</div><input className="inp" value={data.contato} onChange={e=>setData(p=>({...p,contato:e.target.value}))} placeholder="Nome do contato"/></div>
        <div><div className="lbl">Fase</div>
          <select className="inp" value={data.stage} onChange={e=>setData(p=>({...p,stage:e.target.value}))}>
            {STAGES.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
        </div>
        <div><div className="lbl">Notas</div><textarea className="inp" value={data.notas} onChange={e=>setData(p=>({...p,notas:e.target.value}))} placeholder="O que foi discutido..." style={{resize:"vertical",minHeight:64}}/></div>
        <div><div className="lbl">Proximo passo</div><input className="inp" value={data.proximoPasso} onChange={e=>setData(p=>({...p,proximoPasso:e.target.value}))} placeholder="Acao concreta"/></div>
      </div>
      {err&&<div style={{marginTop:10,fontSize:11,color:"#E8451A"}}>{err}</div>}
      <div style={{display:"flex",gap:10,marginTop:20}}>
        <button className="btn-blue" style={{flex:1}} onClick={onSubmit}>Salvar</button>
        <button className="btn-ghost" onClick={onCancel}>Cancelar</button>
      </div>
    </div>
  </div>;
}

function App(){
  const [contacts,setContacts]=useState(()=>{try{const s=localStorage.getItem("kol-crm");return s?JSON.parse(s):SEED}catch{return SEED}});
  const [filterStage,setFilterStage]=useState("all");
  const [recording,setRecording]=useState(false);
  const [transcript,setTranscript]=useState('');
  const [selected,setSelected]=useState(null);
  const [editData,setEditData]=useState(null);
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState(EMPTY);
  const [search,setSearch]=useState("");
  const [toast,setToast]=useState("");
  const [err,setErr]=useState("");
  const recRef=useRef(null);
  const nextId=useRef(200);

  const save=updated=>{setContacts(updated);try{localStorage.setItem("kol-crm",JSON.stringify(updated))}catch{}};
  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(""),3000)};

  const startVoice=useCallback(()=>{
    setErr("");setTranscript("");
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setErr("Use Safari (iPhone) ou Chrome para voz.");return;}
    if(recRef.current)recRef.current.stop();
    const r=new SR();r.lang="pt-BR";r.continuous=true;r.interimResults=true;
    let final="";
    r.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript+" ";else interim+=e.results[i][0].transcript;}setTranscript((final+interim).trim());};
    r.onerror=e=>{setErr("Erro: "+e.error);setRecording(false);};
    r.onend=()=>{setRecording(false);};
    recRef.current=r;r.start();setRecording(true);
  },[]);

  const stopVoice=useCallback(()=>{recRef.current?.stop();recRef.current=null;setRecording(false);},[]);

  const submitForm=()=>{
    if(!form.nome.trim()){setErr("Nome da empresa é obrigatório.");return;}
    const today=new Date().toISOString().slice(0,10);
    const idx=contacts.findIndex(c=>c.nome.toLowerCase()===form.nome.toLowerCase());
    let updated;
    if(idx!==-1){updated=[...contacts];updated[idx]={...updated[idx],...form,updatedAt:today};showToast(`✓ ${form.nome} atualizado`);}
    else{updated=[...contacts,{id:nextId.current++,...form,updatedAt:today}];showToast(`✓ ${form.nome} adicionado`);}
    save(updated);setShowForm(false);setForm(EMPTY);setErr("");
  };

  const saveEdit=()=>{
    save(contacts.map(c=>c.id===editData.id?{...editData,updatedAt:new Date().toISOString().slice(0,10)}:c));
    setSelected(editData);setEditData(null);showToast("✓ Salvo");
  };

  const del=id=>{save(contacts.filter(c=>c.id!==id));setSelected(null);setEditData(null);showToast("Removido");};

  const filtered=contacts
    .filter(c=>filterStage==="all"||c.stage===filterStage)
    .filter(c=>!search||c.nome.toLowerCase().includes(search.toLowerCase())||(c.notas||"").toLowerCase().includes(search.toLowerCase()));

  const counts={};STAGES.forEach(s=>{counts[s.id]=contacts.filter(c=>c.stage===s.id).length;});

  return <>
    <div style={{height:"100vh",display:"flex",flexDirection:"column",background:"#080C1E",overflow:"hidden"}}>
      {/* Header */}
      <div style={{background:"#0F1530",borderBottom:"1px solid #2952FF22",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{fontSize:22,fontWeight:800,letterSpacing:"-0.02em",background:"linear-gradient(135deg,#4B6FFF,#2952FF)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>kol</div>
          <div style={{width:1,height:18,background:"#2952FF33"}}/>
          <div style={{fontSize:11,color:"#8892B0",fontWeight:500}}>Pipeline de Clientes</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <WaveBars active={recording}/>
          <button className="btn-red" style={{padding:"7px 14px",fontSize:12}} onClick={()=>{setForm(EMPTY);setShowForm(true);setSelected(null);}}>+ Nova nota</button>
        </div>
      </div>

      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {/* Sidebar */}
        <div style={{width:185,background:"#0F1530",borderRight:"1px solid #2952FF1A",padding:"14px 8px",display:"flex",flexDirection:"column",gap:3,flexShrink:0,overflowY:"auto"}}>
          <div style={{fontSize:10,color:"#8892B0",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:6,paddingLeft:8}}>Fase</div>
          {[{id:"all",label:"Todos",color:"#2952FF"},...STAGES].map(s=>{
            const count=s.id==="all"?contacts.length:(counts[s.id]||0);
            const active=filterStage===s.id;
            return <button key={s.id} onClick={()=>setFilterStage(s.id)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 10px",borderRadius:8,border:"none",background:active?s.color+"1A":"transparent",color:active?s.color:"#8892B0",cursor:"pointer",fontSize:12,fontWeight:active?700:400,fontFamily:"inherit",transition:"all 0.15s",textAlign:"left",width:"100%"}}>
              <span>{s.label}</span>
              <span style={{background:active?s.color+"2A":"#ffffff0A",color:active?s.color:"#8892B0",borderRadius:10,padding:"1px 7px",fontSize:10,fontWeight:700}}>{count}</span>
            </button>;
          })}
        </div>

        {/* List */}
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          <div style={{padding:"12px 16px",borderBottom:"1px solid #2952FF1A",flexShrink:0}}>
            <input className="inp" placeholder="🔍  buscar empresa ou nota..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <div style={{flex:1,overflowY:"auto",padding:"12px 16px",display:"flex",flexDirection:"column",gap:8}}>
            {filtered.length===0&&<div style={{textAlign:"center",color:"#8892B0",padding:48,fontSize:13}}>{search?`Nenhum resultado para "${search}"`:"Nenhuma empresa nesta fase."}</div>}
            {filtered.map(c=>{
              const isSel=selected?.id===c.id;
              return <div key={c.id} className="card-item" onClick={()=>setSelected(isSel?null:c)} style={{background:"#141936",border:`1px solid ${isSel?"#2952FF66":"#2952FF1A"}`,borderRadius:12,padding:"13px 16px",cursor:"pointer"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0}}>
                    <Avatar nome={c.nome}/>
                    <div style={{minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:14,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.nome}</div>
                      {c.contato&&c.contato!=="—"&&<div style={{fontSize:11,color:"#8892B0"}}>{c.contato}</div>}
                    </div>
                  </div>
                  <StageBadge stageId={c.stage} small/>
                </div>
                {c.proximoPasso&&<div style={{marginTop:8,fontSize:11,color:"#00D4FF",background:"#00D4FF11",borderRadius:6,padding:"4px 10px",display:"inline-block"}}>→ {c.proximoPasso}</div>}
                <div style={{fontSize:10,color:"#8892B033",marginTop:6}}>{c.updatedAt}</div>
              </div>;
            })}
          </div>
        </div>

        {/* Detail */}
        {selected&&!showForm&&!editData&&<div style={{width:280,background:"#0F1530",borderLeft:"1px solid #2952FF1A",padding:18,overflowY:"auto",flexShrink:0,animation:"slideIn 0.2s ease"}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14}}>
            <div><div style={{fontSize:17,fontWeight:800}}>{selected.nome}</div><div style={{marginTop:6}}><StageBadge stageId={selected.stage}/></div></div>
            <button onClick={()=>setSelected(null)} style={{background:"none",border:"none",color:"#8892B0",cursor:"pointer",fontSize:20}}>×</button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {selected.contato&&selected.contato!=="—"&&<div><div className="lbl">Contato</div><div style={{fontSize:13,color:"#CDD6F4"}}>{selected.contato}</div></div>}
            {selected.notas&&<div><div className="lbl">Notas</div><div style={{fontSize:13,color:"#CDD6F4",lineHeight:1.6}}>{selected.notas}</div></div>}
            {selected.proximoPasso&&<div><div className="lbl" style={{color:"#00D4FF"}}>Próximo passo</div><div style={{fontSize:13,color:"#00D4FF",lineHeight:1.6}}>{selected.proximoPasso}</div></div>}
            <div style={{fontSize:10,color:"#8892B033"}}>Atualizado: {selected.updatedAt}</div>
          </div>
          <div style={{display:"flex",gap:8,marginTop:18}}>
            <button className="btn-blue" style={{flex:1,padding:"9px 0",fontSize:12}} onClick={()=>setEditData({...selected})}>Editar</button>
            <button className="btn-ghost" style={{padding:"9px 12px",fontSize:12,color:"#ef4444",borderColor:"#ef444433"}} onClick={()=>del(selected.id)}>✕</button>
          </div>
        </div>}
      </div>
    </div>

    {showForm&&<FormSheet title="Nova nota de cliente" data={form} setData={setForm} onSubmit={submitForm} onCancel={()=>{setShowForm(false);setErr("");stopVoice();setTranscript("");}} recording={recording} onStart={startVoice} onStop={stopVoice} transcript={transcript} err={err}/>}
    {editData&&<FormSheet title={`Editar — ${editData.nome}`} data={editData} setData={setEditData} onSubmit={saveEdit} onCancel={()=>{setEditData(null);setErr("");stopVoice();setTranscript("");}} recording={recording} onStart={startVoice} onStop={stopVoice} transcript={transcript} err={err}/>}

    {toast&&<div style={{position:"fixed",bottom:24,right:24,background:"#2952FF",color:"#fff",borderRadius:10,padding:"10px 18px",fontSize:13,fontWeight:600,zIndex:300,boxShadow:"0 4px 20px #2952FF55",animation:"fadeUp 0.2s ease"}}>{toast}</div>}
  </>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
